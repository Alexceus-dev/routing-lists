name: Обновление списков

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать списки
        run: python3 scripts/build.py
      - name: Закоммитить, если изменились
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- lists/; then
            echo "изменений нет"
          else
            git add -- lists/
            git commit -m "chore(списки обновлены из реестров)"
            git push
          fi
